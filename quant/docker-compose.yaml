name: quant
services:
  quant:
    image: ghcr.io/lewynation/quant:sha-96f106a
    container_name: quant
    restart: unless-stopped
    ports:
      - 3000:3000
    networks:
      - proxy
      - quant
    environment:
      - POSTGRES_HOST=quant_pg
      - POSTGRES_DB=quant
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PORT=5432
      - NODE_ENV=production
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - GOOGLE_GEMINI_API_KEY=${GOOGLE_GEMINI_API_KEY}
      - QUANT_RECOMMENDER_ENDPOINT=http://quant_recommender:8000/recommendations
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - BETTER_AUTH_URL=https://quant.lewynation.dev
      # - BETTER_AUTH_URL=http://localhost:3000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
  quant_pg:
    container_name: quant_pg
    restart: unless-stopped
    image: postgres:latest
    networks:
      - quant
    # ports:
    #   - 127.0.0.1:5432:5432
    volumes:
      - ./volumes/pg-18/data:/var/lib/postgresql/18/docker
    environment:
      - POSTGRES_PASSWORD=100%Quant
      - POSTGRES_USER=postgres
      - POSTGRES_DB=quant

  quant_recommender:
    container_name: quant_recommender
    restart: unless-stopped
    image: ghcr.io/lewynation/quant_recommender:sha-12a75ec
    networks:
      - quant

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4_container
    restart: always
    ports:
      - "8888:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: 12345678
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - proxy
      - quant

networks:
  proxy:
    external: true
  quant:
    external: true
volumes:
  pgadmin-data: